<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a50"/>
      <stop offset="100%" stop-color="#2a2a3e"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="#1a1a2e"/>

  <!-- Monitor body -->
  <rect x="8" y="10" width="112" height="80" rx="8" fill="url(#bezel)"/>
  <!-- Screen -->
  <rect x="13" y="15" width="102" height="70" rx="4" fill="url(#screen)"/>

  <!-- Stand neck -->
  <rect x="52" y="90" width="24" height="12" rx="2" fill="#2a2a3e"/>
  <!-- Stand base -->
  <rect x="36" y="100" width="56" height="6" rx="3" fill="#3a3a50"/>

  <!-- React atom rings (centered in screen at 64, 50) -->
  <ellipse cx="64" cy="50" rx="32" ry="12" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.85"/>
  <ellipse cx="64" cy="50" rx="32" ry="12" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.85" transform="rotate(60 64 50)"/>
  <ellipse cx="64" cy="50" rx="32" ry="12" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.85" transform="rotate(-60 64 50)"/>
  <!-- Center dot -->
  <circle cx="64" cy="50" r="5" fill="#61dafb"/>
</svg>
